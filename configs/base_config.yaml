# DualPath-VLM Configuration File

# Model Settings
model:
  backbone_id: "Qwen/Qwen2.5-VL-7B-Instruct"
  device: "cuda"
  # T4 GPU (16GB VRAM): set to true. A100+: set to false.
  use_4bit: true
  gradient_checkpointing: true
  # LoRA Parameters
  lora:
    r: 16
    alpha: 32
    dropout: 0.1
    target_modules: ["q_proj", "v_proj"]
    top_k_layers: 4

# Multi-Phase Training Hyperparameters
training:
  epochs_phase1: 3     # Warm-up (Pathway F and O isolated)
  epochs_phase2: 10    # Joint Training (F + O + Gating)
  epochs_phase3: 3     # Fine-tuning (Unfroze top backbone layers)
  
  lr_warmup: 0.0002    # 2e-4
  lr_joint: 0.0001     # 1e-4
  lr_finetune: 0.00001 # 1e-5
  
  batch_size: 2        # Per-GPU batch size (T4=2, A100-40GB=4, A100-80GB=8)
  grad_clip: 1.0
  grad_acc_steps: 4    # Effective batch = batch_size * grad_acc_steps * num_gpus
  mixed_precision: "bf16"
  weight_decay: 0.01

# Dual Contrastive Loss Parameters
loss:
  lambda_f: 1.0        # Fabrication weight
  lambda_o: 1.0        # Omission weight
  lambda_g: 0.1        # Gating temporal regularization

# Data Settings
data:
  image_size: 448
  max_length: 512
  train_split: "train"
  val_split: "validation"
  datasets:
    fabrication_triplets: "data/real_fabrication_pairs.jsonl"
    omission_triplets: "data/real_omission_pairs.jsonl"
  ner_model: "en_core_web_sm"

# Evaluation Settings
evaluation:
  eval_every: 1000     # Evaluation steps
  log_every: 50
  save_every: 500
  benchmarks: ["pope_random", "pope_popular", "pope_adversarial", "chair", "mmhal"]

# Paths
paths:
  output_dir: "./outputs/checkpoints"
  log_dir: "./outputs/logs"
  results_dir: "./outputs/results"
  temp_dir: "/tmp/dualpath"

# Reproducibility
seed: 42
